name: Android Release (test)

# Android-only test releases from the dev branch.
# Trigger: push a tag like `android-v1.3.0`, or run manually (workflow_dispatch).
# Desktop release.yml (tags `v*`) is intentionally NOT triggered by these tags.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. android-v1.3.0)"
        required: true
        default: "android-v1.3.0"
  push:
    tags: ["android-v*"]
    branches: ["dev/data-driven-model-docs"]

permissions:
  contents: write

jobs:
  android:
    # Branch pushes only build when the head commit message carries the
    # [android-release] marker (tag pushes and manual runs always build).
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(github.event.head_commit.message, '[android-release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release APK (arm64, unsigned)
        run: npx tauri android build --apk --target aarch64

      # Signing is done by GitHub Actions itself: an ephemeral keystore is
      # generated in the runner for this test build and never leaves it.
      # NOTE: the signature changes between runs — uninstall the previous
      # test build before installing a new one. For a stable release
      # signature, store a fixed keystore in repo secrets and sign with it.
      - name: Sign APK with CI-generated keystore
        run: |
          KS_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$KS_PASS"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -alias networkpp -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Network++ CI, O=Network++, C=IR"
          UNSIGNED="$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -1)"
          echo "unsigned APK: $UNSIGNED"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KS_PASS" --ks-key-alias networkpp \
            --out "$RUNNER_TEMP/Network++-android.apk" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/Network++-android.apk"

      - name: Create GitHub Release with the signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then TAG="${{ inputs.tag }}";
          elif [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}";
          else TAG="android-v1.3.0"; fi
          gh release create "$TAG" "$RUNNER_TEMP/Network++-android.apk" \
            --title "Network++ $TAG (Android test)" \
            --notes "Android-only test build from the dev/data-driven-model-docs branch (v2 data-driven model documents). Signed in CI with an ephemeral keystore — uninstall any previous test build first. Windows/Linux builds are not part of this release." \
            --prerelease \
            --target "$GITHUB_SHA"
