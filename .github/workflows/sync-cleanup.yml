name: sync-cleanup

# One-shot bulk cleanup: removes the pre-v2 files listed in
# scripts/remote-delete-manifest.txt, then removes the manifest and
# this workflow itself. Triggered by the push that adds the manifest.

on:
  push:
    branches:
      - dev/data-driven-model-docs
    paths:
      - scripts/remote-delete-manifest.txt

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove manifest-listed files, then self-clean
        run: |
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if [ -f "$p" ]; then
              git rm -q "$p"
            fi
          done < scripts/remote-delete-manifest.txt
          git rm -q scripts/remote-delete-manifest.txt
          git rm -q .github/workflows/sync-cleanup.yml
          if git diff --cached --quiet; then
            echo "Nothing to remove."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "sync: bulk-remove merged pre-v2 files [skip ci]"
          git push
